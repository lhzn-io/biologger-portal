[project]
name = "biologger-portal"
version = "0.2.0"
description = "Dataset hub and track viewer server for WHOI Marine Predators Group biologger deployments"
license = "Apache-2.0"
authors = [{ name = "Long Horizon Observatory" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "PyJWT[crypto]>=2.9",
  "pyyaml>=6.0",
  # The lab's standard-export loader and georeference, so the portal reads files as the simulator does.
  "biologger-sim",
]

[tool.uv.sources]
biologger-sim = { git = "https://github.com/lhzn-io/biologger-sim", tag = "v0.2.0" }

[project.scripts]
biologger-portal = "biologger_portal.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biologger_portal"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# The formatter wraps code; long SQL strings and URLs are left as they are.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["biologger_sim.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -q"
