# The biologger-portal hub on the fleet host (OrbStack): docker compose -f deploy/compose.yaml up -d --build
#
# The hub is reached on the lab network and over the WireGuard VPN at http://garnet.internal:8797; nothing routes
# to it from the internet. Without Cloudflare Access in front, every visitor is anonymous and read-only (editor
# sign-in on the VPN is planned). The public side is the published viewer (deploy/cloudflare/). Settings come
# from ~/.config/biologger-portal/portal.env, outside the repo (see deploy/portal.env.example).
services:
  portal:
    build:
      context: ..
    image: biologger-portal:latest
    container_name: biologger-portal
    restart: unless-stopped
    ports:
      - "8797:8797"
    env_file:
      - ${HOME}/.config/biologger-portal/portal.env
    environment:
      PORTAL_DATASETS_ROOT: /data
      PORTAL_WEB_DIST: /app/web/dist
    volumes:
      # The canonical datasets folder: read-write, for uploads, the catalog and caches in .portal/.
      - ${DATASETS_DIR:-/Users/lhzn/Projects/whoi-mpg/datasets}:/data
    extra_hosts:
      # topobathykit runs on the host; containers reach it by this name.
      - "garnet.internal:host-gateway"
